---
name: Update Copyright

on:
  schedule:
    - cron: 0 3 1 1 *

jobs:
  update-licence-year:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/licence@569f59706b5f20ef51804f3bda9ccf85ca0f7c7e # v0
        env:
          LICENCE_TOKEN: ${{ secrets.LICENCE_PAT }}
        with:
          licence-file: ./.github/README.md
          licence-token: ${{ env.LICENCE_TOKEN }}
