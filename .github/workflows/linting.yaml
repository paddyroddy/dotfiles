---
name: Linting

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  linting:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/linting@569f59706b5f20ef51804f3bda9ccf85ca0f7c7e # v0
        with:
          pre-commit-config: ./.pre-commit-config.yaml

      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/vale@569f59706b5f20ef51804f3bda9ccf85ca0f7c7e # v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
