---
name: Links

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  links:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/links@569f59706b5f20ef51804f3bda9ccf85ca0f7c7e # v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
